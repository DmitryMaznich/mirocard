<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Hot dish background -->
  <circle cx="120" cy="120" r="116" fill="#fffbf0" stroke="#e8d9b0" stroke-width="3"/>
  <!-- Bowl shadow -->
  <ellipse cx="122" cy="190" rx="64" ry="8" fill="#d4b870" opacity="0.2"/>
  <!-- Bowl outer -->
  <path d="M 60 130 Q 60 198 120 198 Q 180 198 180 130 Z" fill="#e8c880"/>
  <path d="M 64 130 Q 64 192 120 192 Q 176 192 176 130 Z" fill="#f0d898"/>
  <!-- Bowl rim -->
  <ellipse cx="120" cy="130" rx="60" ry="12" fill="#f0d898"/>
  <ellipse cx="120" cy="128" rx="58" ry="10" fill="#f8e8b0"/>
  <!-- Soup surface (golden broth) -->
  <ellipse cx="120" cy="126" rx="54" ry="8" fill="#e8a040"/>
  <ellipse cx="120" cy="124" rx="52" ry="7" fill="#d49030"/>
  <!-- Broth surface shimmer -->
  <ellipse cx="108" cy="122" rx="12" ry="3" fill="#f0b850" opacity="0.5"/>
  <ellipse cx="136" cy="121" rx="10" ry="2.5" fill="#f0b850" opacity="0.4"/>
  <!-- Vegetables in broth -->
  <!-- Carrot circle -->
  <circle cx="96" cy="118" r="9" fill="#e86820"/>
  <circle cx="96" cy="118" r="7" fill="#f07830"/>
  <!-- Carrot lines -->
  <line x1="96" y1="110" x2="96" y2="126" stroke="#e06020" stroke-width="1" opacity="0.6"/>
  <line x1="88" y1="118" x2="104" y2="118" stroke="#e06020" stroke-width="1" opacity="0.6"/>
  <!-- Potato chunk -->
  <rect x="112" y="112" width="16" height="12" rx="4" fill="#f0d870"/>
  <rect x="113" y="113" width="14" height="10" rx="3" fill="#f8e888"/>
  <!-- Chicken piece -->
  <ellipse cx="142" cy="118" rx="14" ry="10" fill="#e09050" transform="rotate(-10 142 118)"/>
  <ellipse cx="140" cy="116" rx="11" ry="8" fill="#eaa060" transform="rotate(-10 140 116)"/>
  <!-- Green onion -->
  <circle cx="106" cy="112" r="4" fill="#5a9040"/>
  <circle cx="130" cy="110" r="3.5" fill="#4e8038"/>
  <circle cx="118" cy="108" r="3" fill="#6aa050"/>
  <!-- Steam -->
  <path d="M 96 112 Q 92 102 96 92" fill="none" stroke="#e8c080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 120 108 Q 116 98 120 88" fill="none" stroke="#e8c080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 144 112 Q 140 102 144 92" fill="none" stroke="#e8c080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
