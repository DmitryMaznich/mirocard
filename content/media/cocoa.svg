<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Drinks background: blue -->
  <circle cx="120" cy="120" r="116" fill="#e8f5fc" stroke="#6aafd4" stroke-width="3"/>
  <!-- Mug shadow -->
  <ellipse cx="122" cy="188" rx="44" ry="7" fill="#6aafd4" opacity="0.2"/>
  <!-- Mug body -->
  <rect x="78" y="110" width="84" height="70" rx="10" fill="#6b3a2a"/>
  <rect x="82" y="114" width="76" height="62" rx="8" fill="#7d4a38"/>
  <!-- Mug handle -->
  <path d="M 162 128 Q 186 128 186 150 Q 186 172 162 172" fill="none" stroke="#6b3a2a" stroke-width="10" stroke-linecap="round"/>
  <path d="M 162 128 Q 180 128 180 150 Q 180 172 162 172" fill="none" stroke="#8c5040" stroke-width="5" stroke-linecap="round"/>
  <!-- Cocoa surface -->
  <ellipse cx="120" cy="113" rx="40" ry="8" fill="#3d1f14"/>
  <ellipse cx="120" cy="111" rx="38" ry="7" fill="#4a2818"/>
  <!-- Foam/cream swirl -->
  <ellipse cx="120" cy="110" rx="28" ry="5" fill="#e8d0b0" opacity="0.9"/>
  <path d="M 98 109 Q 106 104 114 109 Q 122 104 130 109 Q 138 104 146 109" fill="none" stroke="#f0e0c0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Cocoa powder dusting -->
  <circle cx="112" cy="108" r="2" fill="#7a4020" opacity="0.6"/>
  <circle cx="120" cy="106" r="2.5" fill="#7a4020" opacity="0.5"/>
  <circle cx="128" cy="108" r="2" fill="#7a4020" opacity="0.6"/>
  <!-- Steam -->
  <path d="M 104 98 Q 100 88 104 78 Q 108 68 104 58" fill="none" stroke="#b0d8f0" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 120 96 Q 116 86 120 76 Q 124 66 120 56" fill="none" stroke="#b0d8f0" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 136 98 Q 132 88 136 78 Q 140 68 136 58" fill="none" stroke="#b0d8f0" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Mug rim -->
  <rect x="78" y="106" width="84" height="10" rx="5" fill="#8c5040"/>
</svg>
