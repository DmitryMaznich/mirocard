<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Hot dish background -->
  <circle cx="120" cy="120" r="116" fill="#fffbf0" stroke="#e8d9b0" stroke-width="3"/>
  <!-- Plate shadow -->
  <ellipse cx="122" cy="182" rx="68" ry="9" fill="#d4b870" opacity="0.25"/>
  <!-- Plate -->
  <circle cx="120" cy="134" r="72" fill="#fffef8" stroke="#e8dfc0" stroke-width="2.5"/>
  <circle cx="120" cy="134" r="64" fill="none" stroke="#f5edda" stroke-width="1.5"/>
  <!-- Omelet folded shape -->
  <ellipse cx="120" cy="143" rx="52" ry="22" fill="#f0c840"/>
  <path d="M 68 143 Q 94 112 120 118 Q 146 112 172 143 Q 146 158 120 160 Q 94 158 68 143 Z" fill="#f8d850"/>
  <!-- Fold line (crease) -->
  <path d="M 68 143 Q 120 130 172 143" fill="none" stroke="#e8b830" stroke-width="2" opacity="0.5"/>
  <!-- Omelet surface texture -->
  <path d="M 84 136 Q 100 126 118 132" fill="none" stroke="#e8b830" stroke-width="1.5" opacity="0.4"/>
  <path d="M 122 132 Q 140 126 156 136" fill="none" stroke="#e8b830" stroke-width="1.5" opacity="0.4"/>
  <!-- Sausage pieces inside (visible at edges) -->
  <ellipse cx="96" cy="148" rx="9" ry="6" fill="#c03020" transform="rotate(-20 96 148)"/>
  <ellipse cx="108" cy="152" rx="9" ry="6" fill="#c03020" transform="rotate(10 108 152)"/>
  <ellipse cx="122" cy="153" rx="9" ry="6" fill="#b82818" transform="rotate(-5 122 153)"/>
  <ellipse cx="136" cy="150" rx="9" ry="6" fill="#c03020" transform="rotate(15 136 150)"/>
  <ellipse cx="148" cy="146" rx="8" ry="5" fill="#b82818" transform="rotate(-20 148 146)"/>
  <!-- Sausage highlights -->
  <ellipse cx="95" cy="146" rx="4" ry="2.5" fill="#e06050" opacity="0.4" transform="rotate(-20 95 146)"/>
  <ellipse cx="122" cy="151" rx="4" ry="2.5" fill="#e06050" opacity="0.4" transform="rotate(-5 122 151)"/>
  <!-- Golden top highlight -->
  <path d="M 86 130 Q 120 118 154 130" fill="none" stroke="#fff080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
