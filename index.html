<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080f20" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" />
    <title>Mirocard</title>
  </head>
  <body>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #080f20;
        transition: opacity 0.55s ease, transform 0.55s ease;
      }
      #splash.splash--exit { opacity: 0; transform: scale(1.05); pointer-events: none; }

      .spl-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 90% 55% at 50% 58%, #0e2255 0%, #080f20 100%);
      }
      .spl-stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1.5px 1.5px at  8% 12%, rgba(255,255,255,.55) 0%, transparent 100%),
          radial-gradient(1px   1px   at 83% 18%, rgba(255,255,255,.45) 0%, transparent 100%),
          radial-gradient(1px   1px   at 22% 42%, rgba(255,255,255,.35) 0%, transparent 100%),
          radial-gradient(1.5px 1.5px at 68% 72%, rgba(255,255,255,.50) 0%, transparent 100%),
          radial-gradient(1px   1px   at 38% 82%, rgba(255,255,255,.30) 0%, transparent 100%),
          radial-gradient(1px   1px   at 91% 52%, rgba(255,255,255,.40) 0%, transparent 100%),
          radial-gradient(1px   1px   at 14% 76%, rgba(255,255,255,.45) 0%, transparent 100%),
          radial-gradient(1px   1px   at 57%  8%, rgba(255,255,255,.40) 0%, transparent 100%),
          radial-gradient(2px   2px   at 47% 28%, rgba(255,255,255,.25) 0%, transparent 100%),
          radial-gradient(1px   1px   at 76% 38%, rgba(255,255,255,.50) 0%, transparent 100%),
          radial-gradient(1px   1px   at 30% 22%, rgba(255,255,255,.35) 0%, transparent 100%),
          radial-gradient(1px   1px   at 93% 85%, rgba(255,255,255,.30) 0%, transparent 100%);
      }
      .spl-aurora {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle,
          rgba(74,158,255,.18) 0%,
          rgba(61,126,200,.10) 45%,
          transparent 70%);
        animation: aurorapulse 4s ease-in-out infinite;
        opacity: 0;
        animation-fill-mode: both;
      }
      @keyframes aurorapulse {
        0%   { opacity: .7; transform: scale(1);    }
        50%  { opacity: 1;  transform: scale(1.10); }
        100% { opacity: .7; transform: scale(1);    }
      }
      .spl-warmth {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 180px;
        background: linear-gradient(to top, rgba(255,179,71,.07), transparent);
        pointer-events: none;
      }
      .spl-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .spl-logo {
        width: 110px;
        height: auto;
        opacity: 0;
        transform: scale(.82);
        animation: logoin .75s cubic-bezier(.34,1.56,.64,1) .25s forwards;
        filter:
          drop-shadow(0 0 18px rgba(74,158,255,.60))
          drop-shadow(0 0 48px rgba(74,158,255,.25));
      }
      @keyframes logoin { to { opacity: 1; transform: scale(1); } }

      .spl-name {
        margin-top: 22px;
        font-family: 'Bebas Neue', 'Nunito', sans-serif;
        font-size: clamp(44px, 11vw, 68px);
        letter-spacing: .20em;
        color: #fff;
        line-height: 1;
        opacity: 0;
        transform: translateY(8px);
        animation: textin .6s ease .55s forwards;
        text-shadow: 0 0 36px rgba(74,158,255,.45);
      }
      .spl-divider {
        margin-top: 14px;
        width: 36px;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(74,158,255,.8), transparent);
        opacity: 0;
        animation: textin .5s ease .80s forwards;
      }
      .spl-tagline {
        margin-top: 12px;
        font-family: 'Nunito', sans-serif;
        font-size: clamp(14px, 3.6vw, 18px);
        font-weight: 400;
        letter-spacing: .045em;
        color: rgba(255,255,255,.68);
        opacity: 0;
        transform: translateY(7px);
        animation: textin .6s ease .90s forwards;
      }
      @keyframes textin { to { opacity: 1; transform: translateY(0); } }
    </style>

    <div id="splash">
      <div class="spl-bg"></div>
      <div class="spl-stars"></div>
      <div class="spl-aurora"></div>
      <div class="spl-warmth"></div>
      <div class="spl-content">
        <svg class="spl-logo" viewBox="0 0 496 440" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 98.0 0.0 L 376.0 0.0 L 401.0 5.0 L 401.0 7.0 L 388.0 12.0 L 382.0 20.0 L 379.0 17.0 L 369.0 15.0 L 342.0 24.0 L 319.0 23.0 L 291.0 29.0 L 291.0 31.0 L 297.0 29.0 L 313.0 29.0 L 313.0 31.0 L 279.0 41.0 L 229.0 67.0 L 219.0 67.0 L 209.0 61.0 L 215.0 69.0 L 233.0 71.0 L 245.0 67.0 L 265.0 55.0 L 268.0 56.0 L 247.0 71.0 L 204.0 88.0 L 198.0 96.0 L 196.0 112.0 L 200.0 102.0 L 209.0 93.0 L 219.0 91.0 L 206.0 102.0 L 199.0 125.0 L 188.0 136.0 L 200.0 132.0 L 194.0 142.0 L 193.0 151.0 L 201.0 143.0 L 198.0 156.0 L 203.0 167.0 L 206.0 148.0 L 209.0 147.0 L 207.0 151.0 L 209.0 155.0 L 216.0 150.0 L 213.0 159.0 L 214.0 200.0 L 212.0 206.0 L 196.0 224.0 L 176.0 236.0 L 171.0 245.0 L 173.0 255.0 L 191.0 273.0 L 190.0 284.0 L 185.0 289.0 L 186.0 296.0 L 197.0 303.0 L 198.0 310.0 L 209.0 311.0 L 213.0 309.0 L 215.0 311.0 L 212.0 316.0 L 199.0 317.0 L 194.0 322.0 L 195.0 331.0 L 202.0 338.0 L 204.0 344.0 L 203.0 365.0 L 205.0 375.0 L 214.0 386.0 L 224.0 390.0 L 274.0 390.0 L 294.0 396.0 L 304.0 406.0 L 311.0 421.0 L 316.0 440.0 L 92.0 440.0 L 75.0 435.0 L 54.0 422.0 L 42.0 408.0 L 35.0 395.0 L 30.0 374.0 L 31.0 61.0 L 40.0 36.0 L 59.0 15.0 L 77.0 5.0 Z" fill="white"/>
        </svg>
        <div class="spl-name">MIROCARD</div>
        <div class="spl-divider"></div>
        <div class="spl-tagline">Ваш ребёнок сможет больше</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
