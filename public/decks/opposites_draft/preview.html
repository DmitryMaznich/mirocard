<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Opposites — просмотр картинок</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
  h2 { margin: 32px 0 10px; font-size: 1rem; color: #555; text-transform: uppercase; letter-spacing: .05em; border-top: 2px solid #ddd; padding-top: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: #fafafa; }
  .card .name { padding: 6px 8px; font-size: .7rem; color: #777; word-break: break-all; }
  .card .label { padding: 0 8px 8px; font-size: .85rem; font-weight: 600; color: #333; }
  .missing img { background: #fee; }
  .missing .name { color: #c00; }
  .badge { display: inline-block; font-size: .6rem; padding: 1px 5px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
  .badge--left { background: #e3f2fd; color: #1565c0; }
  .badge--right { background: #fff3e0; color: #e65100; }
</style>
</head>
<body>

    { pole:"right", id:"short_rope_1",    label:"короткая верёвка",  file:"media/short_rope_1.webp" },
  ]},

    { pole:"right", id:"dirty_face_1",    label:"грязное лицо",      file:"media/dirty_face_1.webp" },

    { pole:"left",  id:"hot_sand_1",      label:"горячий песок",     file:"media/hot_sand_1.webp" },

concepts.forEach(concept => {
  const h = document.createElement("h2");
  h.textContent = concept.label;
  document.body.appendChild(h);

  const grid = document.createElement("div");
  grid.className = "grid";

  concept.cards.forEach(card => {
    const div = document.createElement("div");
    div.className = "card";

    const img = document.createElement("img");
    img.src = card.file;
    img.alt = card.label;
    img.onerror = () => { div.classList.add("missing"); img.src = ""; img.style.minHeight="140px"; };

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = card.file.replace("media/","");

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = card.label;
    const badge = document.createElement("span");
    badge.className = "badge badge--" + card.pole;
    badge.textContent = card.pole === "left" ? "◀" : "▶";
    label.appendChild(badge);

    div.appendChild(img);
    div.appendChild(name);
    div.appendChild(label);
    grid.appendChild(div);
  });

  document.body.appendChild(grid);
});
</script>
</body>
</html>
