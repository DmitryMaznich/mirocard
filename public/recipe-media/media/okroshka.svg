<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Cold dish background -->
  <circle cx="120" cy="120" r="116" fill="#edfaf0" stroke="#90c890" stroke-width="3"/>
  <!-- Bowl shadow -->
  <ellipse cx="122" cy="190" rx="64" ry="8" fill="#70b870" opacity="0.2"/>
  <!-- Bowl outer -->
  <path d="M 60 130 Q 60 198 120 198 Q 180 198 180 130 Z" fill="#e8f0d8"/>
  <path d="M 64 130 Q 64 192 120 192 Q 176 192 176 130 Z" fill="#f4f8e8"/>
  <!-- Bowl rim -->
  <ellipse cx="120" cy="130" rx="60" ry="12" fill="#f4f8e8"/>
  <ellipse cx="120" cy="128" rx="58" ry="10" fill="#fbfdf3"/>
  <!-- Kefir surface (pale creamy base, no steam — cold dish) -->
  <ellipse cx="120" cy="126" rx="54" ry="8" fill="#f0ecd8"/>
  <ellipse cx="120" cy="124" rx="52" ry="7" fill="#e8e2c8"/>
  <!-- Diced potato -->
  <rect x="90" y="116" width="13" height="10" rx="3" fill="#f0d870"/>
  <rect x="91" y="117" width="11" height="8" rx="2.5" fill="#f8e888"/>
  <!-- Diced cucumber -->
  <rect x="112" y="112" width="11" height="9" rx="2.5" fill="#78b840" transform="rotate(8 117 116)"/>
  <rect x="132" y="118" width="10" height="8" rx="2.5" fill="#88c050" transform="rotate(-6 137 122)"/>
  <!-- Radish slices -->
  <circle cx="106" cy="110" r="6" fill="#e05070"/>
  <circle cx="106" cy="110" r="3.5" fill="#f8e8ec"/>
  <circle cx="146" cy="112" r="5.5" fill="#e05070"/>
  <circle cx="146" cy="112" r="3" fill="#f8e8ec"/>
  <!-- Diced egg -->
  <rect x="124" y="106" width="12" height="9" rx="3" fill="#f8f4e0"/>
  <circle cx="130" cy="110" r="2.5" fill="#f0b840"/>
  <!-- Chicken piece -->
  <ellipse cx="98" cy="122" rx="9" ry="6" fill="#eaa060" transform="rotate(-10 98 122)"/>
  <!-- Green onion / dill flecks -->
  <line x1="112" y1="122" x2="114" y2="112" stroke="#4a9030" stroke-width="2" stroke-linecap="round"/>
  <circle cx="140" cy="106" r="2.5" fill="#4e8038"/>
  <circle cx="150" cy="120" r="2" fill="#5a9040"/>
  <!-- Dollop of sour cream on top -->
  <ellipse cx="120" cy="115" rx="12" ry="8" fill="#ffffff"/>
  <ellipse cx="118" cy="112" rx="7" ry="4.5" fill="#fdfdfb"/>
  <!-- Dill sprig on top -->
  <circle cx="122" cy="108" r="2.5" fill="#4e8038"/>
  <circle cx="127" cy="106" r="2" fill="#5a9040"/>
</svg>
