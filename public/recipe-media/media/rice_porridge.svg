<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Hot dish background -->
  <circle cx="120" cy="120" r="116" fill="#fffbf0" stroke="#e8d9b0" stroke-width="3"/>
  <!-- Bowl shadow -->
  <ellipse cx="122" cy="188" rx="62" ry="8" fill="#d4b870" opacity="0.2"/>
  <!-- Bowl outer -->
  <path d="M 62 130 Q 62 200 120 200 Q 178 200 178 130 Z" fill="#e8c880"/>
  <path d="M 66 130 Q 66 194 120 194 Q 174 194 174 130 Z" fill="#f0d898"/>
  <!-- Bowl rim -->
  <ellipse cx="120" cy="130" rx="58" ry="12" fill="#f0d898"/>
  <ellipse cx="120" cy="128" rx="56" ry="10" fill="#f8e8b0"/>
  <!-- Rice porridge surface (glossy, pale) -->
  <ellipse cx="120" cy="126" rx="52" ry="8" fill="#f8f0dc"/>
  <ellipse cx="120" cy="124" rx="50" ry="7" fill="#f0e6c8"/>
  <!-- Rice grain texture -->
  <ellipse cx="100" cy="120" rx="4" ry="2" fill="#fffaf0" opacity="0.8"/>
  <ellipse cx="112" cy="116" rx="4" ry="2" fill="#fffaf0" opacity="0.8"/>
  <ellipse cx="128" cy="118" rx="4" ry="2" fill="#fffaf0" opacity="0.8"/>
  <ellipse cx="140" cy="122" rx="4" ry="2" fill="#fffaf0" opacity="0.8"/>
  <ellipse cx="118" cy="124" rx="4" ry="2" fill="#fffaf0" opacity="0.7"/>

  <!-- Butter pat melting -->
  <rect x="112" y="106" width="16" height="12" rx="3" fill="#f8d858"/>
  <path d="M 108 116 Q 120 122 132 116 Q 130 122 120 124 Q 110 122 108 116 Z" fill="#f8d858" opacity="0.7"/>

  <!-- Raisins -->
  <ellipse cx="98" cy="112" rx="4" ry="3" fill="#3a2418"/>
  <ellipse cx="142" cy="114" rx="4" ry="3" fill="#3a2418"/>
  <ellipse cx="112" cy="132" rx="3.5" ry="2.5" fill="#3a2418"/>
  <ellipse cx="134" cy="130" rx="3.5" ry="2.5" fill="#3a2418"/>

  <!-- Sugar sprinkle -->
  <circle cx="104" cy="104" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="100" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="136" cy="104" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Steam -->
  <path d="M 106 108 Q 102 98 106 88" fill="none" stroke="#e8c080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 120 106 Q 116 96 120 86" fill="none" stroke="#e8c080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 134 108 Q 130 98 134 88" fill="none" stroke="#e8c080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
