<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Background -->
  <circle cx="120" cy="120" r="116" fill="#fffbf0" stroke="#e8d9b0" stroke-width="3"/>
  <!-- Tray shadow -->
  <rect x="44" y="78" width="154" height="98" rx="8" fill="#c8a060" opacity="0.2"/>
  <!-- Baking tray -->
  <rect x="40" y="72" width="160" height="98" rx="8" fill="#c8a048" stroke="#a88030" stroke-width="2"/>
  <!-- Parchment paper -->
  <rect x="48" y="80" width="144" height="82" rx="4" fill="#faf5e4" stroke="#e4ddb0" stroke-width="1"/>
  <!-- Potato wedge left -->
  <path d="M 62 150 Q 56 122 76 114 Q 88 109 90 128 Q 91 148 74 156 Z" fill="#e8b040" stroke="#c89030" stroke-width="1.5"/>
  <path d="M 68 148 Q 64 128 78 120 Q 85 117 86 132" fill="none" stroke="#c89030" stroke-width="1" opacity="0.6"/>
  <!-- Potato wedge right -->
  <path d="M 152 148 Q 148 120 168 114 Q 180 110 181 130 Q 180 148 164 156 Z" fill="#dfa832" stroke="#c09028" stroke-width="1.5"/>
  <path d="M 158 146 Q 155 124 170 118 Q 177 116 178 132" fill="none" stroke="#c09028" stroke-width="1" opacity="0.6"/>
  <!-- Potato wedge bottom -->
  <path d="M 105 158 Q 100 138 116 132 Q 128 129 130 145 Q 130 160 114 164 Z" fill="#d8a030" stroke="#b88020" stroke-width="1.5"/>
  <!-- Chicken drumstick (body) -->
  <ellipse cx="120" cy="112" rx="30" ry="22" fill="#b86820" stroke="#904810" stroke-width="2"/>
  <!-- Crispy skin highlight -->
  <ellipse cx="112" cy="106" rx="16" ry="11" fill="#d88030" opacity="0.65"/>
  <ellipse cx="128" cy="116" rx="10" ry="7" fill="#c87028" opacity="0.5"/>
  <!-- Drumstick bone -->
  <rect x="116" y="130" width="8" height="20" rx="4" fill="#ece0b8" stroke="#d0c090" stroke-width="1.5"/>
  <circle cx="120" cy="151" r="6" fill="#ece0b8" stroke="#d0c090" stroke-width="1.5"/>
  <!-- Rosemary sprig -->
  <line x1="90" y1="92" x2="108" y2="110" stroke="#4a7028" stroke-width="2" stroke-linecap="round"/>
  <line x1="91" y1="95" x2="87" y2="92" stroke="#5a8838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="93" y1="98" x2="89" y2="95" stroke="#5a8838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="101" x2="92" y2="98" stroke="#5a8838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="99" y1="104" x2="95" y2="101" stroke="#5a8838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="107" x2="98" y2="104" stroke="#5a8838" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Garlic cloves -->
  <ellipse cx="150" cy="94" rx="9" ry="7" fill="#faf0d0" stroke="#d8c880" stroke-width="1.5" transform="rotate(-15 150 94)"/>
  <ellipse cx="163" cy="99" rx="7" ry="5.5" fill="#f5ebc8" stroke="#d0c078" stroke-width="1.5" transform="rotate(10 163 99)"/>
</svg>
