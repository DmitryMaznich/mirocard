  <ellipse cx="90" cy="94" rx="3" ry="1.6" fill="#fff2d0" transform="rotate(-20 90 94)"/>
  <ellipse cx="106" cy="88" rx="3" ry="1.6" fill="#fff2d0" transform="rotate(10 106 88)"/>
  <ellipse cx="122" cy="86" rx="3" ry="1.6" fill="#fff2d0" transform="rotate(-15 122 86)"/>
  <ellipse cx="138" cy="90" rx="3" ry="1.6" fill="#fff2d0" transform="rotate(20 138 90)"/>
  <ellipse cx="152" cy="98" rx="3" ry="1.6" fill="#fff2d0" transform="rotate(-10 152 98)"/>
  <ellipse cx="112" cy="100" rx="3" ry="1.6" fill="#fff2d0" transform="rotate(5 112 100)"/>
  <ellipse cx="132" cy="104" rx="3" ry="1.6" fill="#fff2d0" transform="rotate(-5 132 104)"/>
