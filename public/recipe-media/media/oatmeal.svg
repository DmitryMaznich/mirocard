<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Hot dish background -->
  <circle cx="120" cy="120" r="116" fill="#fffbf0" stroke="#e8d9b0" stroke-width="3"/>
  <!-- Bowl shadow -->
  <ellipse cx="122" cy="188" rx="62" ry="8" fill="#d4b870" opacity="0.2"/>
  <!-- Bowl outer -->
  <path d="M 62 130 Q 62 200 120 200 Q 178 200 178 130 Z" fill="#e8c880"/>
  <path d="M 66 130 Q 66 194 120 194 Q 174 194 174 130 Z" fill="#f0d898"/>
  <!-- Bowl rim -->
  <ellipse cx="120" cy="130" rx="58" ry="12" fill="#f0d898"/>
  <ellipse cx="120" cy="128" rx="56" ry="10" fill="#f8e8b0"/>
  <!-- Oatmeal surface -->
  <ellipse cx="120" cy="126" rx="52" ry="8" fill="#e8c888"/>
  <ellipse cx="120" cy="124" rx="50" ry="7" fill="#d4ac68"/>
  <!-- Oatmeal texture - flake bumps -->
  <ellipse cx="104" cy="120" rx="8" ry="4" fill="#c89848" opacity="0.6"/>
  <ellipse cx="120" cy="116" rx="9" ry="4" fill="#c89848" opacity="0.6"/>
  <ellipse cx="136" cy="120" rx="8" ry="4" fill="#c89848" opacity="0.6"/>
  <ellipse cx="110" cy="128" rx="7" ry="3.5" fill="#c89848" opacity="0.5"/>
  <ellipse cx="130" cy="127" rx="7" ry="3.5" fill="#c89848" opacity="0.5"/>
  <ellipse cx="96" cy="126" rx="6" ry="3" fill="#c89848" opacity="0.45"/>
  <ellipse cx="144" cy="124" rx="6" ry="3" fill="#c89848" opacity="0.45"/>
  <!-- Honey drizzle -->
  <path d="M 108 114 Q 116 108 124 114 Q 130 108 138 114" fill="none" stroke="#f0a820" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Berries on top -->
  <circle cx="104" cy="114" r="6" fill="#c02848"/>
  <circle cx="104" cy="114" r="4.5" fill="#d83858"/>
  <circle cx="120" cy="108" r="6" fill="#c02848"/>
  <circle cx="120" cy="108" r="4.5" fill="#d83858"/>
  <circle cx="136" cy="113" r="6" fill="#c02848"/>
  <circle cx="136" cy="113" r="4.5" fill="#d83858"/>
  <!-- Berry highlights -->
  <circle cx="102" cy="112" r="2" fill="#ff6070" opacity="0.5"/>
  <circle cx="118" cy="106" r="2" fill="#ff6070" opacity="0.5"/>
  <circle cx="134" cy="111" r="2" fill="#ff6070" opacity="0.5"/>
  <!-- Steam -->
  <path d="M 106 108 Q 102 98 106 88" fill="none" stroke="#e8c080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 120 106 Q 116 96 120 86" fill="none" stroke="#e8c080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 134 108 Q 130 98 134 88" fill="none" stroke="#e8c080" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
