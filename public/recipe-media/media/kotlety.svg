<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Background -->
  <circle cx="120" cy="120" r="116" fill="#fffbf0" stroke="#e8d9b0" stroke-width="3"/>
  <!-- Plate shadow -->
  <ellipse cx="122" cy="184" rx="70" ry="9" fill="#d4b870" opacity="0.22"/>
  <!-- Plate -->
  <circle cx="120" cy="136" r="74" fill="#fffef8" stroke="#e8dfc0" stroke-width="2.5"/>
  <circle cx="120" cy="136" r="66" fill="none" stroke="#f5edda" stroke-width="1.5"/>

  <!-- Kotleta 1 (back-left) -->
  <ellipse cx="100" cy="130" rx="32" ry="19" fill="#c07828" transform="rotate(-12 100 130)"/>
  <!-- flour crust highlight -->
  <ellipse cx="96" cy="125" rx="24" ry="13" fill="#d99040" transform="rotate(-12 96 125)"/>
  <ellipse cx="90" cy="122" rx="12" ry="7" fill="#e8a848" opacity="0.7" transform="rotate(-12 90 122)"/>
  <!-- crust texture lines -->
  <path d="M 78 126 Q 92 118 110 125" fill="none" stroke="#a06020" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <path d="M 80 132 Q 95 124 112 131" fill="none" stroke="#a06020" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <!-- flour dusting dots -->
  <circle cx="84" cy="120" r="2" fill="#f0d890" opacity="0.8"/>
  <circle cx="104" cy="118" r="1.5" fill="#f0d890" opacity="0.7"/>
  <circle cx="95" cy="137" r="2" fill="#f0d890" opacity="0.6"/>

  <!-- Kotleta 2 (back-right) -->
  <ellipse cx="142" cy="128" rx="30" ry="18" fill="#b87028" transform="rotate(10 142 128)"/>
  <ellipse cx="140" cy="123" rx="22" ry="12" fill="#d08838" transform="rotate(10 140 123)"/>
  <ellipse cx="133" cy="120" rx="11" ry="6" fill="#e0a040" opacity="0.7" transform="rotate(10 133 120)"/>
  <path d="M 122 122 Q 136 114 154 122" fill="none" stroke="#986018" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <path d="M 124 130 Q 138 122 156 129" fill="none" stroke="#986018" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <circle cx="148" cy="117" r="1.5" fill="#f0d890" opacity="0.7"/>
  <circle cx="130" cy="133" r="2" fill="#f0d890" opacity="0.6"/>

  <!-- Kotleta 3 (front-center) -->
  <ellipse cx="120" cy="153" rx="34" ry="20" fill="#c07828"/>
  <ellipse cx="118" cy="148" rx="26" ry="14" fill="#d89038"/>
  <ellipse cx="112" cy="145" rx="13" ry="8" fill="#e8a840" opacity="0.75"/>
  <path d="M 96 148 Q 112 138 140 147" fill="none" stroke="#a06020" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <path d="M 98 155 Q 114 146 142 154" fill="none" stroke="#a06020" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <!-- flour dusting -->
  <circle cx="102" cy="144" r="2.5" fill="#f0d890" opacity="0.75"/>
  <circle cx="132" cy="142" r="2" fill="#f0d890" opacity="0.7"/>
  <circle cx="118" cy="162" r="2" fill="#f0d890" opacity="0.6"/>
  <circle cx="140" cy="158" r="1.5" fill="#f0d890" opacity="0.6"/>

  <!-- Butter shine gloss -->
  <ellipse cx="112" cy="145" rx="6" ry="3" fill="#fff8d0" opacity="0.45" transform="rotate(-15 112 145)"/>
  <ellipse cx="92" cy="122" rx="5" ry="2.5" fill="#fff8d0" opacity="0.4" transform="rotate(-12 92 122)"/>
