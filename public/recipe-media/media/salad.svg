  <line x1="95" y1="126" x2="97" y2="110" stroke="#4a9030" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="152" y1="122" x2="154" y2="106" stroke="#4a9030" stroke-width="2.5" stroke-linecap="round"/>
