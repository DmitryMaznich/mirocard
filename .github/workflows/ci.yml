name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (incl. migration + paywall integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (backend)
        run: npm ci
        working-directory: backend
      - name: Backend security audit (production dependencies -- blocking)
        run: npm audit --audit-level=high
        working-directory: backend
      # Named separately per the launch checklist even though it's part of
      # the same suite -- proves the orders/entitlements backfill migration
      # (backend/lib/db.mjs) and its idempotency-across-restarts guarantee
      # specifically, not just "tests passed in general".
      - name: Migration test (db.mjs backfill + idempotency)
        run: node --test tests/db.test.mjs
        working-directory: backend
      # Same reasoning -- this is the P0-1 paywall-bypass regression suite
      # specifically (real HTTP server, not just repository-level calls).
      - name: Paywall integration test
        run: node --test tests/paywall.test.mjs
        working-directory: backend
      - name: Full backend test suite
        run: node --test tests/*.test.mjs
        working-directory: backend

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      - name: Language and rollout unit checks
        run: |
          node tests/localization/ui-language.test.mjs
          node tests/localization/account-languages.test.mjs
          node tests/localization/rollout.test.mjs
      - name: Vitest
        run: npx vitest run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      # backend/ is fully lint-clean as of this launch-prep branch --
      # blocking, so it can't silently regress.
      - name: Lint backend (blocking)
        run: npx eslint backend
      # The rest of the repo (src/, tools/, scripts/, landing/) carries
      # pre-existing lint debt from before this branch (~190 violations,
      # confirmed present on origin/main -- see docs/release-evidence.md)
      # that a commercial-launch security/billing pass didn't take on.
      # Reported, not blocking, so it doesn't mask this workflow's actual
      # purpose (verifying the payment/paywall/legal work) behind
      # unrelated failures, while still keeping the numbers visible on
      # every run so the debt can't be quietly forgotten either.
      - name: Lint full repo (informational -- see comment above)
        run: npx eslint .
        continue-on-error: true

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      - name: npm ci (backend)
        run: npm ci
        working-directory: backend
      - name: Build
        run: npm run build
      - name: Root security audit (build tooling -- informational, see docs/release-evidence.md)
        run: npm audit --audit-level=high
        continue-on-error: true

  railway-smoke:
    name: Railway application smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify current production on PR; wait for exact rollout on main
        env:
          MIROCARD_EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          MIROCARD_EXPECT_LOCALIZATION: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/verify-localization-rollout.mjs

  container-smoke:
    name: Production container startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Railway production image
        run: docker build --build-arg RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" -t mirocard-runtime-check .
      - name: Start an isolated production container with test-only configuration
        run: |
          docker run -d --name mirocard-runtime-check -p 127.0.0.1:3012:3012 \
            -e SERVE_STATIC=1 -e MIROCARD_DATA_DIR=/data -e RAILWAY_ENVIRONMENT=ci -e RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" \
            -e AUTH_SECRET=ci-auth-not-a-secret -e ACCOUNT_SECRET=ci-account-not-a-secret \
            -e MIROCARD_DEPLOY_TOKEN=ci-deploy-not-a-secret -e MIROCARD_ADMIN_TOKEN=ci-admin-not-a-secret \
            -e RESEND_API_KEY=ci-unused-mail-key -e LEGAL_DOCS_VERSION=draft \
            mirocard-runtime-check
      - name: Verify image startup, database, SPA and catalog
        env:
          MIROCARD_PUBLIC_URL: http://127.0.0.1:3012
          MIROCARD_EXPECTED_SHA: ${{ github.sha }}
          MIROCARD_EXPECT_LOCALIZATION: '1'
        run: |
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 45 --max-time 2 http://127.0.0.1:3012/api/healthz
          timeout 45s node scripts/verify-localization-rollout.mjs
      - name: Container logs
        if: always()
        run: docker logs mirocard-runtime-check || true
      - name: Clean up test container
        if: always()
        run: docker rm -f mirocard-runtime-check || true
