name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (incl. migration + paywall integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (backend)
        run: npm ci
        working-directory: backend
      - name: Backend security audit (production dependencies -- blocking)
        run: npm audit --audit-level=high
        working-directory: backend
      # Named separately per the launch checklist even though it's part of
      # the same suite -- proves the orders/entitlements backfill migration
      # (backend/lib/db.mjs) and its idempotency-across-restarts guarantee
      # specifically, not just "tests passed in general".
      - name: Migration test (db.mjs backfill + idempotency)
        run: node --test tests/db.test.mjs
        working-directory: backend
      # Same reasoning -- this is the P0-1 paywall-bypass regression suite
      # specifically (real HTTP server, not just repository-level calls).
      - name: Paywall integration test
        run: node --test tests/paywall.test.mjs
        working-directory: backend
      - name: Full backend test suite
        run: node --test tests/*.test.mjs
        working-directory: backend

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      - name: Vitest
        run: npx vitest run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      # backend/ is fully lint-clean as of this launch-prep branch --
      # blocking, so it can't silently regress.
      - name: Lint backend (blocking)
        run: npx eslint backend
      # The rest of the repo (src/, tools/, scripts/, landing/) carries
      # pre-existing lint debt from before this branch (~190 violations,
      # confirmed present on origin/main -- see docs/release-evidence.md)
      # that a commercial-launch security/billing pass didn't take on.
      # Reported, not blocking, so it doesn't mask this workflow's actual
      # purpose (verifying the payment/paywall/legal work) behind
      # unrelated failures, while still keeping the numbers visible on
      # every run so the debt can't be quietly forgotten either.
      - name: Lint full repo (informational -- see comment above)
        run: npx eslint .
        continue-on-error: true

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      - name: npm ci (backend)
        run: npm ci
        working-directory: backend
      - name: Build
        run: npm run build
      - name: Root security audit (build tooling -- informational, see docs/release-evidence.md)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-release-identity:
    # Proves a production-like image (Dockerfile, no .git in the context --
    # see .dockerignore) reports the exact commit it was built from, and
    # that a build without a SHA fails instead of shipping gitSha "unknown".
    name: Docker image reports its commit SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build without a SHA must fail
        run: |
          if docker build -t mirocard:no-sha . ; then
            echo "::error::image built without a commit SHA"; exit 1
          fi
      - name: Build with the commit SHA
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t mirocard:ci .
      - name: Running container reports that SHA on /api/version and /healthz
        run: |
          docker run -d --name app -p 3012:3012 \
            -e RAILWAY_ENVIRONMENT=ci -e SERVE_STATIC=1 -e MIROCARD_DATA_DIR=/tmp/data \
            -e AUTH_SECRET=ci -e ACCOUNT_SECRET=ci -e MIROCARD_DEPLOY_TOKEN=ci \
            -e MIROCARD_ADMIN_TOKEN=ci -e RESEND_API_KEY=ci \
            mirocard:ci
          for i in $(seq 1 30); do curl -fsS localhost:3012/healthz >/dev/null && break; sleep 1; done
          expected=$(echo "${{ github.sha }}" | cut -c1-7)
          version=$(curl -fsS localhost:3012/api/version)
          health=$(curl -fsS localhost:3012/healthz)
          echo "expected=$expected version=$version health=$health"
          echo "$version" | grep -q "\"gitSha\":\"$expected\""
          echo "$health"  | grep -q "\"gitSha\":\"$expected\""
          docker exec app test ! -e /app/.git
          # sharp (photo normalization) must load in the production image:
          docker exec -w /app/backend app node --input-type=module -e "import sharp from 'sharp'; console.log('sharp', sharp.versions.sharp, 'libvips', sharp.versions.vips)"
      - name: Container logs
        if: always()
        run: docker logs app || true
