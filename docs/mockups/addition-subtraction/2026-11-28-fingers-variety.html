<h1>«Пальцы → цифра»: обычные или разные пальцы</h1>
<p>Число и раскладка по рукам выбираются одинаково. Разница только в том, <b>какими пальцами</b> показано число на каждой руке.</p>
<div class="head"><div></div><div>Обычные<small>всегда стандартная поза:<br>1 — указательный, 2 — + средний, …</small></div><div>Разные<small>любая из нарисованных поз:<br>«коза», большой + мизинец, …</small></div></div>
