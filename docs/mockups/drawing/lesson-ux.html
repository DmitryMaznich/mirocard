<div id="app"></div>
<dialog id="settings" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title">Для взрослого</h2><button class="dialog-close" aria-label="Закрыть настройки">×</button></div><p class="parent-progress"></p><label class="setting"><span>Слова на кнопках</span><input type="checkbox" id="labels" checked></label><label class="setting"><span>Переход тапом по рисунку</span><input type="checkbox" id="tap-board"></label><label class="setting"><span>Шуршание карандаша</span><input type="checkbox" id="pencil-sound" checked></label><label class="setting"><span>Темп анимации</span><select id="speed"><option value="slow">Медленно</option><option value="normal" selected>Обычно</option><option value="fast">Быстро</option></select></label><div class="dialog-actions"><button id="previous">Вернуться на один шаг</button><button id="drawings">Другой рисунок</button><button id="reset" class="danger">Начать рисунок сначала…</button></div><p class="adult-note">Чтобы открыть это меню на детском экране, удерживайте шестерёнку. Во время настройки анимация стоит на паузе. Продолжение — по кнопке ребёнка.</p></dialog>
