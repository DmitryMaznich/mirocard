<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Год: месяцы и времена года (макет)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{font-family:Nunito,sans-serif;background:#5f7478;width:1280px;height:800px;display:flex;align-items:center;justify-content:center;color:#0f3b4c}
.m{width:1180px;height:560px;background:#fffdf8;border-radius:34px;padding:28px 72px;position:relative;display:flex;flex-direction:column}
.x{position:absolute;top:20px;right:22px;width:56px;height:56px;border-radius:50%;background:#0f3b4c;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center}
h1{font-size:40px;font-weight:900;margin-bottom:22px}
.year{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.s{height:120px;border-radius:18px 18px 6px 6px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.s::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,0) 30%,rgba(255,255,255,.85))}
.s b{position:relative;z-index:1;font-size:24px;font-weight:900}
.s.now{box-shadow:inset 0 0 0 4px #0f3b4c}
.mo{height:120px;border-radius:6px 6px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:900;position:relative}
.winter{background:#e6f1fa}.spring{background:#ecf6e6}.summer{background:#fff6d8}.autumn{background:#fdeede}
.mo.now{background:#d76747;color:#fff;box-shadow:0 0 0 3px #fff,0 0 0 6px #d76747}
.mo i{font-style:normal;font-size:26px;line-height:1}
.say{margin-top:34px;display:flex;align-items:center;gap:22px;background:#fff3ec;border-radius:24px;padding:22px 30px}
.say .l{font-size:44px;font-weight:950}
.say .l b{color:#c2410c}
.say .chip{font-size:26px;font-weight:900;background:#fff;border-radius:16px;padding:6px 16px}
.nav{position:absolute;top:255px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.nav.l{left:14px}.nav.r{right:14px}
.cycle{margin-top:auto;font-size:20px;font-weight:800;color:#5d7378}
</style></head><body><div class="m"><div class="x">✕</div>
<h1>Год</h1>
<div class="year" id="y"></div>
<div class="say"><span class="l">Сейчас <b>ноябрь</b></span><span class="chip">🍂 Осень</span><span class="chip">🎂 День рождения мамы</span></div>
<div class="nav l">‹</div><div class="nav r">›</div>
</div>
<script>
const months=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const seasons=[['autumn','Осень',[8,9,10]],['winter','Зима',[11,0,1]],['spring','Весна',[2,3,4]],['summer','Лето',[5,6,7]]];
const now=10;
const shift=+(new URLSearchParams(location.search).get('s')||0);
const order=[0,1,2,3].map(i=>seasons[(i+shift)%4]);
let h='';
order.forEach(([id,name,ms],i)=>{const cur=ms.includes(now);
 h+=`<div class="s ${id}${cur?' now':''}" style="grid-column:${i*3+1}/${i*3+4}"><img src="../../../public/daily-orientation/season_${id}.webp"><b>${name}</b></div>`;});
order.forEach(([id,name,ms],i)=>ms.forEach((m,j)=>{h+=`<div class="mo ${id}${m===now?' now':''}" style="grid-row:2;grid-column:${i*3+j+1}">${months[m]}${m===10?'<i>🎂</i>':''}</div>`;}));
y.innerHTML=h;
</script></body></html>
