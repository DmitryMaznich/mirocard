<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>«Сегодня» — концепт 02: лента дня</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,sans-serif;background:#e9e4da;color:#0f3b4c}
.screen{width:1280px;height:800px;margin:0 auto;padding:16px 28px 24px;display:grid;grid-template-rows:60px 330px 1fr;gap:16px;background:linear-gradient(#fbf8f2,#f4efe6)}
.cap{font-size:21px;font-weight:800;color:#47606b}
.card{border-radius:28px;box-shadow:0 2px 10px rgba(60,40,10,.08);padding:16px 22px;position:relative;overflow:hidden}
.nav{display:flex;gap:26px;align-items:center;font-size:24px;font-weight:900;color:#7a8b93}
.nav .on{color:#0f3b4c;background:#e4f2ee;padding:6px 22px;border-radius:20px;font-size:30px}
.r1{display:grid;grid-template-columns:1fr 330px 300px;gap:16px}
.r2{display:grid;grid-template-columns:300px 1fr;gap:16px}
.weekday{background:#e7f4ef;display:flex;flex-direction:column}
.big{font-size:64px;font-weight:900;letter-spacing:-1px;line-height:1;margin:auto 0}
.leaf{background:#f6e7d3;display:flex;flex-direction:column}
.leaf .row{margin:auto 0;display:flex;flex-direction:column;align-items:center}
.num{font-size:120px;font-weight:900;line-height:.95;color:#c2410c}
.mon{font-size:44px;font-weight:900}
.sez{margin-top:8px;font-size:24px;font-weight:900;color:#fff;background:#b7793a;border-radius:12px;padding:2px 14px}
.time{background:#e4f0fb;display:flex;flex-direction:column;align-items:center}
.clock{width:150px;height:150px;border-radius:50%;border:9px solid #3d7ca6;background:#fff;position:relative;margin-top:6px}
.clock b{position:absolute;font-size:19px}
.clock .h,.clock .mn{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;border-radius:4px}
.clock .h{width:8px;height:38px;margin-left:-4px;background:#c2410c;transform:rotate(var(--ha))}
.clock .mn{width:5px;height:56px;margin-left:-2.5px;background:#1d4ed8;transform:rotate(var(--ma))}
.dig{font-size:40px;font-weight:900;margin-top:4px}.dig span:first-child{color:#c2410c}.dig span:last-child{color:#1d4ed8}
.tw{font-size:19px;font-weight:900;text-align:center;line-height:1.1}.tw .hh{color:#c2410c}.tw .mm{color:#1d4ed8}
.left{display:grid;grid-template-rows:1fr 120px;gap:16px}
.now{background:#fff3e2;display:flex;flex-direction:column}
.now .big{font-size:72px}
.wx{background:#eef4f7;display:flex;align-items:center;gap:14px}
.wx .ic{font-size:56px}.wx .tx{font-size:28px;font-weight:900}
.today{background:#fff8ee;display:flex;flex-direction:column}
.viewport{flex:1;overflow:hidden;position:relative;margin:8px -22px 0;padding:0 22px}
.track{display:flex;gap:10px;align-items:center;height:100%;transform:translateX(var(--shift,0))}
.st{flex:none;width:168px;height:220px;background:#fff;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:22px;position:relative;box-shadow:0 1px 5px rgba(0,0,0,.08);border:4px solid transparent}
.st .e{font-size:88px;line-height:1.15}
.st.done{opacity:.38}
.st.done::after{content:"✓";position:absolute;top:8px;right:14px;font-size:34px;color:#16a34a}
.st.next{border-color:#0f3b4c}
.st.imp{background:#fff7dc;border-color:#f59e0b}
.arrow{flex:none;font-size:34px;color:#c7ab84;font-weight:900}
.fade{position:absolute;top:0;bottom:0;width:60px;pointer-events:none}
.fade.r{right:0;background:linear-gradient(90deg,rgba(255,248,238,0),#fff8ee)}
.fade.l{left:0;background:linear-gradient(270deg,rgba(255,248,238,0),#fff8ee)}
</style></head><body>
<div class="screen">
  <nav class="nav"><span>ВЧЕРА</span><span class="on">СЕГОДНЯ</span><span>ЗАВТРА</span></nav>
  <div class="r1">
    <section class="card weekday"><div class="cap">День недели</div><div class="big">ПОНЕДЕЛЬНИК</div></section>
    <section class="card leaf"><div class="row"><div class="cap">Число</div><div class="num">23</div><div class="cap" style="margin-top:6px">Месяц</div><div class="mon">НОЯБРЬ</div><div class="sez">ОСЕНЬ</div></div></section>
    <section class="card time"><div class="cap">Время</div>
      <div class="clock" id="clk" style="--ha:250deg;--ma:120deg"><b style="top:2px;left:50%;transform:translateX(-50%)">12</b><b style="right:6px;top:50%;transform:translateY(-50%)">3</b><b style="bottom:2px;left:50%;transform:translateX(-50%)">6</b><b style="left:8px;top:50%;transform:translateY(-50%)">9</b><div class="h"></div><div class="mn"></div></div>
      <div class="dig" id="dig"><span>08</span>:<span>20</span></div>
      <div class="tw" id="tw"><span class="hh">ВОСЕМЬ ЧАСОВ</span> <span class="mm">ДВАДЦАТЬ МИНУТ</span></div>
    </section>
  </div>
  <div class="r2">
    <div class="left">
      <section class="card now" id="nowc"><div class="cap">Сейчас</div><div class="big" id="dp">УТРО</div></section>
      <section class="card wx"><div class="ic">☀️</div><div><div class="cap">Погода</div><div class="tx">СОЛНЕЧНО</div></div></section>
    </div>
    <section class="card today"><div class="cap">Сегодня</div>
      <div class="viewport"><div class="track" id="track"></div><div class="fade r"></div><div class="fade l" id="fl" style="display:none"></div></div>
    </section>
  </div>
</div>
<script>
const s=new URLSearchParams(location.search).get('t')||'morning';
const items=[['🏫','ШКОЛА'],['🏊','БАССЕЙН'],['🍽️','ОБЕД'],['🌳','ПРОГУЛКА'],['👵','БАБУШКА','imp'],['🛁','ВАННА'],['🛏️','СОН']];
const done=s==='afternoon'?3:0;
track.innerHTML=items.map((it,i)=>`<div class="st${i<done?' done':''}${i===done?' next':''}${it[2]?' '+it[2]:''}"><span class="e">${it[0]}</span>${it[1]}</div>`).join('<span class="arrow">›</span>');
if(s==='afternoon'){
  track.style.setProperty('--shift','-410px');fl.style.display='block';
  dp.textContent='ДЕНЬ';nowc.style.background='#e6f3fb';
  clk.style.setProperty('--ha','105deg');clk.style.setProperty('--ma','60deg');
  dig.innerHTML='<span>15</span>:<span>10</span>';tw.innerHTML='<span class="hh">ПЯТНАДЦАТЬ ЧАСОВ</span> <span class="mm">ДЕСЯТЬ МИНУТ</span>';
}
</script></body></html>
