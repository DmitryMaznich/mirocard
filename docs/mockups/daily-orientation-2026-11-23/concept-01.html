<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>«Сегодня» — концепт 01 (крупные мазки)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,sans-serif;background:#e9e4da;color:#0f3b4c}
.screen{width:1280px;height:800px;margin:0 auto;padding:18px 28px 24px;display:grid;grid-template-rows:64px 300px 1fr;gap:18px;background:linear-gradient(#fbf8f2,#f4efe6);position:relative;overflow:hidden}
.cap{font-size:22px;font-weight:800;color:#47606b}
.card{background:#fff;border-radius:28px;box-shadow:0 2px 10px rgba(60,40,10,.08);padding:18px 24px;position:relative;overflow:hidden}
/* carousel */
.nav{display:flex;justify-content:center;gap:90px;align-items:center;font-size:30px;font-weight:900;color:#7a8b93}
.nav .on{color:#0f3b4c;background:#e4f2ee;padding:6px 30px;border-radius:20px;font-size:38px}
/* row 1 */
.row{display:grid;gap:18px}
.r1{grid-template-columns:1fr 400px}
.r2{grid-template-columns:1fr 400px}
.weekday{background:#e7f4ef;display:flex;flex-direction:column}
.wd-top{display:flex;align-items:center;gap:22px;margin-top:6px}
.wd-name{margin-top:8px;font-size:76px;font-weight:900;letter-spacing:-2px;line-height:1}
.wd-plan{margin-top:auto;align-self:flex-start;display:flex;align-items:center;gap:18px;background:#fff;border-radius:22px;padding:10px 26px 10px 14px;font-size:34px;font-weight:900}
.wd-plan b{font-size:72px;line-height:1}
.week{margin-top:auto;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.d{height:92px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#0f3b4c;background:var(--c);border:3px solid transparent}
.d i{font-style:normal;font-size:30px;height:36px}
.d.past{opacity:.35}
.d.past::after{content:"✓";position:absolute}
.d.today{border-color:#0f3b4c;transform:scale(1.08);box-shadow:0 4px 12px rgba(0,0,0,.15)}
/* date leaf */
.leaf{padding:0;display:flex;flex-direction:column;color:#3b2410}
.leaf .pic{position:absolute;inset:0;background:url(../../../public/daily-orientation/season_autumn.webp) center/cover}
.leaf .fade{position:absolute;inset:0;background:linear-gradient(rgba(255,246,232,.0) 0%,rgba(255,246,232,.88) 38%,rgba(255,246,232,.96) 100%)}
.leaf .ring{position:relative;height:22px;display:flex;justify-content:center;gap:120px;margin-top:-6px}
.leaf .ring span{width:16px;height:30px;border-radius:8px;background:#8a5a2b}
.leaf .body{position:relative;flex:1;display:grid;grid-template-columns:1fr 1.15fr;align-items:center;padding:4px 18px 18px}
.num{font-size:140px;font-weight:900;line-height:.9;color:#c2410c;text-align:center}
.lab{font-size:20px;font-weight:800;color:#8a6a4a;text-align:center}
.mon{font-size:40px;font-weight:900;text-align:center;line-height:1.05}
.seas{display:inline-block;margin-top:14px;font-size:30px;font-weight:900;background:#db9f48;color:#fff;border-radius:14px;padding:4px 16px}
/* row 2: day */
.day{background:#fff3e2;display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:center}
.dp{display:flex;flex-direction:column;align-self:start}
.dp .word{font-size:76px;font-weight:900;line-height:1;margin-top:4px}
.dp .sky{margin-top:auto;height:150px;border-radius:22px;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:78px;position:relative}
.dp .sky small{position:absolute;bottom:8px;font-size:15px;font-weight:800;color:#fff;background:rgba(0,0,0,.25);padding:2px 10px;border-radius:10px}
.flow{display:flex;flex-direction:column;justify-content:center}
.tiles{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:14px;align-items:end;height:250px}
.t{background:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;font-weight:900;height:170px;position:relative}
.t .e{font-size:70px;line-height:1.1}
.t .n{font-size:24px}
.t .k{position:absolute;top:-16px;font-size:17px;font-weight:900;background:#fff;border-radius:10px;padding:2px 12px;color:#47606b;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.t.was{opacity:.45}
.t.was::after{content:"✓";position:absolute;top:10px;right:16px;font-size:30px;color:#16a34a;opacity:1}
.t.now{height:215px;border:5px solid #0f3b4c}
.t.now .e{font-size:100px}.t.now .n{font-size:30px}
.t.now .k{background:#0f3b4c;color:#fff;font-size:20px}
.bar{margin-top:16px;display:grid;grid-template-columns:5fr 6fr 3fr 4fr;height:44px;border-radius:14px;overflow:hidden;position:relative;font-weight:900;font-size:17px}
.bar div{display:flex;align-items:center;justify-content:center;color:#0f3b4c}
.bar .m{background:#fde68a}.bar .dd{background:#bfe3f7}.bar .ev{background:#d9c8f3}.bar .ni{background:#334a6b;color:#dfe8f5}
.bar .cur{outline:4px solid #0f3b4c;outline-offset:-4px}
.marker{position:absolute;top:-8px;bottom:-8px;width:6px;background:#c2410c;border-radius:3px;left:var(--x)}
/* right column */
.rc{display:grid;grid-template-rows:1fr 104px;gap:16px}
.time{background:#e4f0fb;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:14px 18px}
.clock{width:150px;height:150px;border-radius:50%;border:9px solid #3d7ca6;background:#fff;position:relative}
.clock .h,.clock .mn{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;border-radius:4px}
.clock .h{width:8px;height:40px;margin-left:-4px;background:#c2410c;transform:rotate(var(--ha))}
.clock .mn{width:5px;height:58px;margin-left:-2.5px;background:#1d4ed8;transform:rotate(var(--ma))}
.tw .dig{font-size:44px;font-weight:900}.tw .dig span:first-child{color:#c2410c}.tw .dig span:last-child{color:#1d4ed8}
.tw .w{font-size:25px;font-weight:900;line-height:1.1;margin-top:4px}
.tw .w .hh{color:#c2410c}.tw .w .mm{color:#1d4ed8}
.weather{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#eef4f7}
.weather .ic{font-size:56px}
.weather .tx{font-size:30px;font-weight:900;line-height:1}
.weather .st{font-size:16px;font-weight:800;color:#6b7f88;margin-top:4px}
.weather.stale{background:#f4f1e9}
.weather.stale .ic{width:64px;height:64px;border-radius:50%;background:#e3ddd0;display:flex;align-items:center;justify-content:center;font-size:36px;color:#9a917f}
/* tap hint */
.tap::before{content:"👆";position:absolute;right:12px;bottom:8px;font-size:18px;opacity:.35}
/* night */
.night .screen{background:#0d1726;filter:none}
.night .card,.night .nav{visibility:hidden}
.night .sleep{display:flex}
.sleep{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#c9d6ea;font-weight:900}
.sleep .moon{font-size:160px}.sleep .w{font-size:96px;letter-spacing:2px}.sleep .s{font-size:40px;color:#8fa3c0}.sleep .c{font-size:44px;color:#6f84a3;margin-top:20px}

/* top bar with important-date ribbon */
.topbar{display:flex;align-items:center;gap:18px}
.topbar .nav{flex:none;gap:26px;font-size:24px}
.topbar .nav .on{font-size:30px;padding:6px 22px}
.rib{display:none;flex:1;height:64px;border-radius:20px;align-items:center;gap:14px;padding:0 18px 0 8px;font-weight:900;font-size:28px;background:#fff7dc;box-shadow:0 2px 8px rgba(120,80,0,.12);position:relative}
.rib .ph{width:52px;height:52px;border-radius:50%;background:#fde68a;display:flex;align-items:center;justify-content:center;font-size:34px;flex:none;border:3px solid #fff}
.rib .marks{margin-left:auto;display:flex;gap:6px;align-items:center}
.rib .marks i{width:20px;height:20px;border-radius:50%;background:#f59e0b;display:block}
.rib .marks i.off{background:#eadfc4}
.rib .q{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid #e6d7a8;display:flex;align-items:center;justify-content:center;font-size:22px;color:#a07a1a;flex:none}
.rib .photos{display:flex;gap:6px;margin-left:auto}
.rib .photos span{width:52px;height:52px;border-radius:10px;background:#e9dfcc;display:flex;align-items:center;justify-content:center;font-size:26px}
.has-rib .rib{display:flex}
.d .ev{position:absolute;top:-10px;right:-6px;font-size:26px;background:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.2)}
.d{position:relative}
.sticker{display:none;position:absolute;right:14px;bottom:14px;width:74px;height:74px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:44px;align-items:center;justify-content:center;z-index:2}

.garland{display:none;position:absolute;top:0;left:0;right:0;height:26px;background:repeating-linear-gradient(90deg,transparent 0 6px,transparent 6px 60px);z-index:5}
.festive .garland{display:flex;justify-content:space-around}
.garland b{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:24px solid var(--g)}
.festive .screen{background:linear-gradient(#fff4e0,#fbead2)}
.pin{position:absolute;top:-30px;font-size:24px;background:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.25);transform:translateX(-50%);left:var(--x)}
.pin::after{content:"";position:absolute;bottom:-12px;left:50%;margin-left:-2px;width:4px;height:12px;background:#c2410c}
.bar{overflow:visible}
</style></head>
<body>
<div class="screen">
  <div class="garland"><b style="--g:#ef4444"></b><b style="--g:#f59e0b"></b><b style="--g:#22c55e"></b><b style="--g:#3b82f6"></b><b style="--g:#a855f7"></b><b style="--g:#ef4444"></b><b style="--g:#f59e0b"></b><b style="--g:#22c55e"></b><b style="--g:#3b82f6"></b><b style="--g:#a855f7"></b><b style="--g:#ef4444"></b><b style="--g:#f59e0b"></b><b style="--g:#22c55e"></b><b style="--g:#3b82f6"></b><b style="--g:#a855f7"></b><b style="--g:#ef4444"></b><b style="--g:#f59e0b"></b><b style="--g:#22c55e"></b><b style="--g:#3b82f6"></b><b style="--g:#a855f7"></b><b style="--g:#ef4444"></b><b style="--g:#f59e0b"></b><b style="--g:#22c55e"></b><b style="--g:#3b82f6"></b><b style="--g:#a855f7"></b></div>
  <div class="topbar"><nav class="nav"><span>ВЧЕРА</span><span class="on">СЕГОДНЯ</span><span>ЗАВТРА</span></nav><div class="rib" id="rib"></div></div>

  <div class="row r1">
    <section class="card weekday tap">
      <div class="cap">День недели</div>
      <div class="wd-name">ПОНЕДЕЛЬНИК</div><div class="wd-plan"><b>🎨</b><span>РИСОВАНИЕ</span></div>
    </section>
    <section class="card leaf tap">
      <div class="sticker" id="stk">👵</div><div class="pic"></div><div class="fade"></div>
      <div class="body">
        <div><div class="lab">Число</div><div class="num">23</div></div>
        <div style="text-align:center"><div class="lab">Месяц</div><div class="mon">НОЯБРЬ</div><div class="seas">ОСЕНЬ</div></div>
      </div>
    </section>
  </div>

  <div class="row r2">
    <section class="card day tap">
      <div class="dp">
        <div class="cap">Сейчас</div>
        <div class="word" id="dpw">УТРО</div>
      </div>
      <div class="flow">
        <div class="tiles" id="tiles">
          <div class="t was"><span class="k">было</span><span class="e">🥣</span><span class="n">ЗАВТРАК</span></div>
          <div class="t now"><span class="k">СЕЙЧАС</span><span class="e">🏫</span><span class="n">ДЕТСКИЙ САД</span></div>
          <div class="t"><span class="k">потом</span><span class="e">🍲</span><span class="n">ОБЕД</span></div>
        </div>
      </div>
    </section>
    <div class="rc">
      <section class="card time tap">
        <div class="clock" id="clk" style="--ha:250deg;--ma:120deg"><b style="position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:20px">12</b><b style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:20px">3</b><b style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:20px">6</b><b style="position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:20px">9</b><div class="h"></div><div class="mn"></div></div>
        <div class="tw"><div class="cap">Время</div><div class="dig" id="dig"><span>08</span>:<span>20</span></div>
          <div class="w" id="tw"><span class="hh">ВОСЕМЬ ЧАСОВ</span><br><span class="mm">ДВАДЦАТЬ МИНУТ</span></div></div>
      </section>
      <section class="card weather tap" id="wx">
        <div class="ic">☀️</div><div><div class="tx">СОЛНЕЧНО</div></div>
      </section>
    </div>
  </div>

  <div class="sleep"><div class="moon">🌙</div><div class="w">НОЧЬ</div><div class="c">23:40</div></div>
</div>
<script>
const s=new URLSearchParams(location.search).get('t');
if(s==='evening'){
  dpw.textContent='ВЕЧЕР';
  
  document.querySelector('.day').style.background='#efe7fb';
  tiles.innerHTML=`<div class="t was"><span class="k">было</span><span class="e">🍽️</span><span class="n">УЖИН</span></div>
   <div class="t now"><span class="k">СЕЙЧАС</span><span class="e">🛁</span><span class="n">ВАННА</span></div>
   <div class="t"><span class="k">потом</span><span class="e">🛏️</span><span class="n">СОН</span></div>`;
  
  clk.style.setProperty('--ha','600deg');clk.style.setProperty('--ma','66deg');
  dig.innerHTML='<span>20</span>:<span>11</span>';
  tw.innerHTML='<span class="hh">ДВАДЦАТЬ ЧАСОВ</span><br><span class="mm">ОДИННАДЦАТЬ МИНУТ</span>';
  wx.classList.add('stale');wx.innerHTML='<div class="ic">?</div><div><div class="tx">ПОГОДА?</div><div class="st">посмотри в окно</div></div>';
}
if(s==='dawn'){
  tiles.innerHTML=`<div class="t was"><span class="k">было</span><span class="e">🛏️</span><span class="n">СОН</span></div>
   <div class="t now"><span class="k">СЕЙЧАС</span><span class="e">🪥</span><span class="n">УМЫВАЕМСЯ</span></div>
   <div class="t"><span class="k">потом</span><span class="e">🥣</span><span class="n">ЗАВТРАК</span></div>`;
  clk.style.setProperty('--ha','205deg');clk.style.setProperty('--ma','300deg');
  dig.innerHTML='<span>06</span>:<span>50</span>';
  tw.innerHTML='<span class="hh">ШЕСТЬ ЧАСОВ</span><br><span class="mm">ПЯТЬДЕСЯТ МИНУТ</span>';
  wx.classList.add('stale');wx.innerHTML='<div class="ic">?</div><div><div class="tx">ПОГОДА?</div></div>';
}
if(s==='night')document.body.classList.add('night');

const B=document.body;
if(s==='countdown'){B.classList.add('has-rib');
 rib.innerHTML='<div class="ph">🎄</div>НОВЫЙ ГОД ЧЕРЕЗ 5 ДНЕЙ<div class="marks"><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></div><div class="q">?</div>';
 }
if(s==='event'){B.classList.add('has-rib','festive');
 rib.innerHTML='<div class="ph">👵</div>СЕГОДНЯ ПРИЕЗД БАБУШКИ!<div class="q" style="margin-left:auto">?</div>';
 }
if(s==='yesterday'){B.classList.add('has-rib');
 document.querySelector('.nav .on').classList.remove('on');document.querySelector('.nav span').classList.add('on');
 rib.innerHTML='<div class="ph">👵</div>ВЧЕРА БЫЛ ПРИЕЗД БАБУШКИ<div class="photos"><span>📷</span><span>📷</span><span>📷</span></div><div class="q">?</div>';
 document.querySelector('.wd-name').textContent='ВОСКРЕСЕНЬЕ';
 document.querySelector('.wd-plan').innerHTML='<b>🏠</b><span>ДОМА</span>';
 
 document.querySelector('.num').textContent='22';
 document.querySelector('.r2').style.opacity='.35';}
</script>
</body></html>
