<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Рисование — детский интерфейс</title>
<style>
:root{--app-safe-top:env(safe-area-inset-top,0px);--app-safe-bottom:env(safe-area-inset-bottom,0px);--app-safe-left:env(safe-area-inset-left,0px);--app-safe-right:env(safe-area-inset-right,0px);--ink:#274139;--accent:#28655a;--paper:#fffefa;--ground:#f2f1e9}*{box-sizing:border-box}body{margin:0;font:18px system-ui,sans-serif;background:var(--ground);color:var(--ink)}button,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,select:focus-visible{outline:4px solid #eab73b;outline-offset:3px}button:disabled{cursor:default;opacity:.42}button svg{pointer-events:none}svg{display:block}.shell{height:100dvh;display:flex;flex-direction:column;padding:calc(8px + var(--app-safe-top)) calc(14px + var(--app-safe-right)) calc(12px + var(--app-safe-bottom)) calc(14px + var(--app-safe-left));max-width:980px;margin:auto;gap:8px}.top{height:48px;flex:none;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:21px;font-weight:650;margin:0;letter-spacing:-.3px}.adult{width:48px;height:48px;display:grid;place-items:center;background:transparent;border:0;border-radius:15px;color:#66756d;touch-action:none}.adult svg{width:27px;height:27px}.adult.holding{background:#e2e8dc}.pencil-space{height:68px;display:flex;align-items:center;justify-content:center;flex:none}.pencil-space svg{width:240px;max-width:70vw;height:68px}.board{flex:1;min-height:0;background:var(--paper);border:1px solid #dedfd5;border-radius:25px;overflow:hidden;position:relative}.board>svg{width:100%;height:100%;display:block}.controls{display:grid;grid-template-columns:minmax(100px,1fr) 1.7fr;gap:12px;flex:none;padding-top:4px}.control{height:82px;min-width:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border:1px solid #c8d3c9;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 #243e3210;touch-action:manipulation}.control.primary{background:var(--accent);border-color:var(--accent);color:white;box-shadow:0 3px 0 #193f37}.control svg{height:38px;width:44px;flex:none}.control-label{font-size:16px;line-height:20px;font-weight:600}.icons-only .control-label{visibility:hidden}.picker{padding:calc(24px + var(--app-safe-top)) calc(20px + var(--app-safe-right)) calc(20px + var(--app-safe-bottom)) calc(20px + var(--app-safe-left));max-width:900px;margin:auto;min-height:100dvh}.picker h1{font-size:28px;margin:8px 0 6px}.picker p{margin:0;color:#65756b;font-size:17px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}.card{background:var(--paper);border:1px solid #d9dfd3;padding:14px;border-radius:25px;color:var(--ink);display:flex;align-items:center;flex-direction:column;gap:12px;box-shadow:0 5px 0 #243e3208}.cards--many .card{padding:12px;gap:8px}.cards--many .card img{height:clamp(130px,23dvh,240px)}.cards--many .card:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc((100% - 18px)/2)}.card img{display:block;width:100%;height:min(49vh,380px);object-fit:contain}.card span{font-size:21px;font-weight:650}.card small{font-size:14px;color:#65796b;min-height:18px}.picker-adult{float:right}.done-view{display:flex;flex-direction:column;flex:1;min-height:0;gap:12px}.done-view .board{flex:1}.done-title{text-align:center;font-size:22px;font-weight:600;margin:4px 0 0}.done-action{height:76px;width:100%;border:0;border-radius:22px;background:var(--accent);color:white;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;flex:none}.done-action svg{height:28px;width:28px}dialog{position:fixed;border:1px solid #d4ddd1;border-radius:25px;background:#fffefa;color:var(--ink);padding:22px;width:min(440px,calc(100vw - 28px - var(--app-safe-left) - var(--app-safe-right)));max-height:calc(100dvh - 36px - var(--app-safe-top) - var(--app-safe-bottom));overflow:auto;margin:auto}dialog::backdrop{background:#21352d77}.dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog-heading h2{margin:0;font-size:22px}.dialog-close{border:0;background:transparent;border-radius:12px;min-height:48px;min-width:48px;font-size:27px}.setting{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-bottom:1px solid #e4e8df}.setting span{font-size:17px}.setting input{width:25px;height:25px;accent-color:var(--accent);flex:none}.setting select{padding:10px;border:1px solid #c9d3c7;background:white;border-radius:12px;max-width:150px;color:inherit}.parent-progress{font-size:15px;color:#69796c;margin:10px 0 6px}.dialog-actions{display:grid;gap:10px;margin-top:18px}.dialog-actions button{min-height:50px;background:white;border:1px solid #cbd5c9;border-radius:13px;padding:12px;color:inherit;text-align:left}.dialog-actions .danger{color:#9c3b37}.adult-note{font-size:14px;line-height:1.55;color:#69796c;margin-top:16px}.pause-curtain{position:absolute;inset:0;background:#fffefa66;display:grid;place-items:center;pointer-events:none}.pause-curtain svg{width:50px;height:50px;color:#64796d}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}body.modal-open{overflow:hidden}[hidden]{display:none!important}@media(min-width:760px){.shell{max-width:760px}.controls{max-width:570px;width:100%;align-self:center}.control{height:86px}.pencil-space{height:76px}}@media(max-height:650px){.pencil-space{height:45px}.pencil-space svg{height:46px}.top{height:40px}.control{height:68px}.shell{gap:5px}.control svg{height:25px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app"></div>
<dialog id="settings" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title">Для взрослого</h2><button class="dialog-close" aria-label="Закрыть настройки">×</button></div><p class="parent-progress"></p><label class="setting"><span>Слова на кнопках</span><input type="checkbox" id="labels" checked></label><label class="setting"><span>Переход тапом по рисунку</span><input type="checkbox" id="tap-board"></label><label class="setting"><span>Шуршание карандаша</span><input type="checkbox" id="pencil-sound" checked></label><label class="setting"><span>Темп анимации</span><select id="speed"><option value="slow">Медленно</option><option value="normal" selected>Обычно</option><option value="fast">Быстро</option></select></label><div class="dialog-actions"><button id="previous">Вернуться на один шаг</button><button id="drawings">Другой рисунок</button><button id="reset" class="danger">Начать рисунок сначала…</button></div><p class="adult-note">Чтобы открыть это меню на детском экране, удерживайте шестерёнку. Во время настройки анимация стоит на паузе. Продолжение — по кнопке ребёнка.</p></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">Начать сначала?</h2><p>Сделанные шаги этого рисунка сбросятся.</p><div class="dialog-actions"><button id="cancel-reset">Оставить рисунок</button><button id="confirm-reset" class="danger">Начать сначала</button></div></dialog>
<script type="module">
import cards from './data.json';import {createDrawingPlayer} from './previewPlayer.js';import {toolForStep} from '../../src/topics/renderers/drawing/lessonPlan.js';
const app=document.getElementById('app'),settings=document.getElementById('settings'),confirmDialog=document.getElementById('confirm');let current=null,ready=false;const games=new Map();const choices={labels:true,tap:false,speed:'normal',pencilSound:true};const ns='http://www.w3.org/2000/svg';
const icons={next:'<path d="M7 16h18M19 7l9 9-9 9"/>',repeat:'<path d="M7 10a11 11 0 1 1-1 14M7 3v8h8"/>',gear:'<path d="M13 3h6l1 4 4 2 4-1 3 5-3 3 0 4 3 3-3 5-4-1-4 2-1 4h-6l-1-4-4-2-4 1-3-5 3-3v-4l-3-3 3-5 4 1 4-2z"/><circle cx="16" cy="18" r="5"/>',pause:'<path d="M11 7v18M22 7v18"/>',home:'<path d="M4 6h11v23H4ZM20 6h11v23H20Z"/><path d="M7 22l3-4 3 4M23 22l3-4 3 4"/>'};
const icon=name=>`<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
const gearButton=()=>`<button class="adult" aria-label="Настройки взрослого — удерживать" title="Удерживайте, чтобы открыть настройки">${icon('gear')}</button>`;
function pencil(tool){return `<svg viewBox="0 0 268 80" aria-hidden="true"><ellipse cx="132" cy="68" rx="100" ry="4" fill="#26352d" opacity=".08"/><g transform="rotate(-5 134 38)"><path d="M190 18 248 37 190 56Z" fill="#e9bf87"/><path d="M190 18 248 37 194 35Z" fill="#f8dbad"/><path d="M190 56 248 37 194 40Z" fill="#d9a56c"/><path d="M30 18H190Q197 28 190 37Q197 47 190 56H30Q20 56 20 46V28Q20 18 30 18Z" fill="${tool.color}"/><path d="M30 18H190Q193 23 193 28H24V25Q24 18 30 18Z" fill="white" opacity=".28"/><path d="M24 46H193Q194 51 190 56H30Q24 56 24 50Z" fill="black" opacity=".13"/><path d="M232 31.8 248 37 232 42.2Z" fill="${tool.color}"/><path d="M36 24H165" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".32"/></g></svg>`}
function bindGear(){const button=app.querySelector('.adult');if(!button)return;let timer;button.onpointerdown=e=>{if(e.button!==0)return;button.classList.add('holding');timer=setTimeout(()=>{button.classList.remove('holding');openSettings()},1200)};const clear=()=>{clearTimeout(timer);button.classList.remove('holding')};button.onpointerup=clear;button.onpointerleave=clear;button.onpointercancel=clear;button.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSettings()}}}
function save(game){try{localStorage.setItem('drawing-ux:'+game.card.id,JSON.stringify({index:game.state.index,phase:game.phase}))}catch{}}
function picker(){current?.player.stopFinale();current=null;app.innerHTML=`<main class="picker"><div class="picker-adult">${gearButton()}</div><h1>Рисование</h1><p>Выбери рисунок</p><div class="cards"></div></main>`;if(cards.length>2)app.querySelector('.cards').classList.add('cards--many');for(const card of cards){const button=document.createElement('button');button.className='card';const image=document.createElement('img');image.src='data:image/svg+xml,'+encodeURIComponent(card.cover);image.alt=card.label;button.append(image);const name=document.createElement('span');name.textContent=card.label;button.append(name);const status=document.createElement('small');let progress=games.get(card.id)?.state.index??0;try{progress=JSON.parse(localStorage.getItem('drawing-ux:'+card.id))?.index??progress}catch{}status.textContent=progress>0&&progress<card.lesson.steps.length?'Продолжить':'';button.append(status);button.onclick=()=>openLesson(card);app.querySelector('.cards').append(button)}bindGear()}
function makeGame(card){const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',card.lesson.viewBox);svg.setAttribute('role','img');svg.setAttribute('aria-label',card.label);const game={card,svg,state:{index:0,busy:false,paused:false},phase:'ready',player:null};game.player=createDrawingPlayer(svg,card.lesson,state=>{const wasBusy=game.state.busy;game.state=state;if(wasBusy&&!state.busy&&state.index>0){game.phase='copy';save(game)}if(current===game&&ready)update()},'ux-'+card.id);game.player.setSpeed(choices.speed);game.player.setSoundEnabled(choices.pencilSound);let saved;try{saved=JSON.parse(localStorage.getItem('drawing-ux:'+card.id))}catch{}if(Number.isFinite(saved?.index)&&saved.index>0){game.pendingRestore=Math.min(card.lesson.steps.length,Math.floor(saved.index));game.phase=saved.phase==='done'&&game.pendingRestore===card.lesson.steps.length?'done':'copy'}return game}
function openLesson(card){ready=false;current=games.get(card.id)??makeGame(card);games.set(card.id,current);app.innerHTML=`<main class="shell"><header class="top"><h1></h1>${gearButton()}</header><div class="pencil-space" role="img"></div><div class="board"></div><div class="controls"><button class="control repeat" aria-label="Показать этот шаг ещё раз">${icon('repeat')}<span class="control-label">Ещё раз</span></button><button class="control primary next" aria-label="Дальше">${icon('next')}<span class="control-label">Дальше</span></button></div><span class="sr-only" role="status" aria-live="polite"></span></main>`;app.querySelector('h1').textContent=card.label;app.querySelector('.board').append(current.svg);if(current.pendingRestore!==undefined){current.player.restore(current.pendingRestore);delete current.pendingRestore;}app.querySelector('.board').onclick=()=>{if(choices.tap)next()};app.querySelector('.next').onclick=next;app.querySelector('.repeat').onclick=repeat;bindGear();ready=true;update()}
function shownStep(game){return game.phase==='copy'||game.phase==='done'?Math.max(0,game.state.index-1):Math.min(game.state.index,game.card.lesson.steps.length-1)}
function update(){if(!current||!ready)return;const game=current,{index,busy,paused}=game.state;app.querySelector('.shell')?.classList.toggle('icons-only',!choices.labels);const context=toolForStep(game.card.lesson,shownStep(game));const slot=app.querySelector('.pencil-space');if(slot){slot.innerHTML=game.phase==='done'?'':pencil(context.tool);slot.setAttribute('aria-label',game.phase==='done'?'Рисунок готов':context.tool.name)}if(game.phase==='done'){doneScreen(game);return}const nextButton=app.querySelector('.next');if(!nextButton){openLesson(game.card);return}nextButton.disabled=busy&&!paused;const repeatButton=app.querySelector('.repeat');repeatButton.disabled=busy||index===0;const status=app.querySelector('[role="status"]');if(status)status.textContent=paused?'Анимация на паузе':game.phase==='copy'?'Можно рисовать на бумаге':game.phase==='tool'?'Подготовьте следующий карандаш':'Показать следующий шаг';app.querySelector('.pause-curtain')?.remove();if(paused){const shade=document.createElement('div');shade.className='pause-curtain';shade.innerHTML=icon('pause');app.querySelector('.board').append(shade)}if(game.phase==='done')doneScreen(game)}
function next(){if(!current)return;const game=current;if(game.state.busy){if(game.state.paused){game.player.togglePause();update()}return}if(game.phase==='copy'){if(game.state.index===game.card.lesson.steps.length){game.phase='done';save(game);doneScreen(game);game.player.playFinale();return}const previous=toolForStep(game.card.lesson,game.state.index-1).tool.id,nextTool=toolForStep(game.card.lesson,game.state.index).tool.id;if(previous!==nextTool){game.phase='tool';save(game);update();return}}game.phase='animating';game.player.next();update()}
function repeat(){if(!current||current.state.busy||!current.state.index)return;current.phase='animating';current.player.repeat();update()}
function doneScreen(game){app.querySelector('.pencil-space').innerHTML='';app.querySelector('.controls').innerHTML=`<button class="done-action">${icon('home')}<span class="control-label">Рисунки</span></button>`;app.querySelector('.controls').style.gridTemplateColumns='1fr';app.querySelector('.done-action').onclick=picker;app.querySelector('h1').textContent='Рисунок готов';app.querySelector('.pause-curtain')?.remove()}
function openSettings(){current?.player.stopFinale();if(current?.state.busy&&!current.state.paused)current.player.togglePause();document.querySelector('.parent-progress').textContent=current?`${current.card.label} · показано ${current.state.index} из ${current.card.lesson.steps.length} шагов`:'Настройки детского экрана';document.getElementById('previous').disabled=!current||current.state.busy||!current.state.index;document.getElementById('reset').disabled=!current;settings.showModal();document.body.classList.add('modal-open')}
function closeSettings(){settings.close();document.body.classList.remove('modal-open');if(current)update()}
settings.querySelector('.dialog-close').onclick=closeSettings;settings.addEventListener('cancel',()=>{document.body.classList.remove('modal-open')});document.getElementById('labels').onchange=e=>{choices.labels=e.target.checked;if(current)update()};document.getElementById('tap-board').onchange=e=>{choices.tap=e.target.checked};document.getElementById('pencil-sound').onchange=e=>{choices.pencilSound=e.target.checked;for(const game of games.values())game.player.setSoundEnabled(choices.pencilSound)};document.getElementById('speed').onchange=e=>{choices.speed=e.target.value;for(const game of games.values())game.player.setSpeed(choices.speed)};document.getElementById('drawings').onclick=()=>{closeSettings();picker()};document.getElementById('previous').onclick=()=>{if(current&&!current.state.busy){current.player.back();current.phase=current.state.index?'copy':'ready';save(current);closeSettings();update()}};document.getElementById('reset').onclick=()=>{settings.close();confirmDialog.showModal()};document.getElementById('cancel-reset').onclick=()=>{confirmDialog.close();settings.showModal()};document.getElementById('confirm-reset').onclick=()=>{if(current){current.player.reset();current.phase='ready';save(current);const card=current.card;confirmDialog.close();document.body.classList.remove('modal-open');openLesson(card)}};
window.__drawingUx={get:()=>current&&({index:current.state.index,busy:current.state.busy,phase:current.phase,tool:toolForStep(current.card.lesson,shownStep(current)).tool.id}),seek:(index,phase='copy')=>{current.player.restore(index);current.phase=phase;save(current);update()},openSettings};picker();const id=new URLSearchParams(location.search).get('lesson');if(id&&cards.some(c=>c.id===id))openLesson(cards.find(c=>c.id===id));
</script></html>
