        (figure.dots ?? []).forEach((point) => {
          const target = mirror(point, figure.axisCol);
          canvas.append(svg("circle", { class: "mirror-dot", cx: target.col, cy: target.row, r: .05 }));
        });
        (figure.circles ?? []).forEach((circle) => {
          const target = mirror(circle, figure.axisCol);
          canvas.append(svg("circle", { class: "mirror-circle", cx: target.col, cy: target.row, r: circle.diameter / 2 }));
        });
        (figure.fixedPaths ?? []).forEach((path) => canvas.append(svg("path", { class: "fixed-mirror", d: d(path.map((point) => mirror(point, figure.axisCol))) })));
        (figure.fixedDots ?? []).forEach((point) => {
          const target = mirror(point, figure.axisCol);
          canvas.append(svg("circle", { class: "fixed-mirror-dot", cx: target.col, cy: target.row, r: .06 }));
        });
        (figure.fixedCircles ?? []).forEach((circle) => {
          const target = mirror(circle, figure.axisCol);
          canvas.append(svg("circle", { class: "fixed-mirror-circle", cx: target.col, cy: target.row, r: circle.diameter / 2 }));
        });
      }
      figure.decorations.forEach((decoration) => drawDecoration(canvas, decoration));
      wrap.append(canvas);
      const foot = document.createElement("footer");
      foot.className = "card-foot";
      const id = document.createElement("span");
      id.className = "card-id";
      id.textContent = figure.id;
      const detail = document.createElement("span");
      detail.textContent = figure.detail;
      const download = document.createElement("a");
      download.className = "card-json";
      download.href = `../symmetry_draw/figures/${figure.id}.json`;
      download.download = `${figure.id}.json`;
      download.textContent = "JSON";
      download.title = "Скачать JSON для мастерской";
      const edit = document.createElement("a");
      edit.className = "card-edit";
      // Do not fetch the JSON again in the workshop. Browsers intentionally
      // block fetch() between local file:// URLs, which made this action fail
      // when the tools were opened directly from the repository.
      edit.href = `figure_capture.html?card=${encodeURIComponent(JSON.stringify(figure.editorCard))}`;
      edit.addEventListener("click", () => {
        // Some embedded browsers reuse an already open workshop tab and may
        // discard a long local-file query. window.name survives this same-tab
        // navigation and is cleared by the workshop immediately after use.
        window.name = `mirocard-grid-figure:${JSON.stringify(figure.editorCard)}`;
      });
      edit.textContent = "В мастерскую";
      edit.title = "Открыть эту фигуру для редактирования";
      const actions = document.createElement("span");
      actions.className = "card-actions";
      actions.append(download, edit);
      foot.append(id, detail, actions);
      card.append(head, wrap, foot);
      return card;
    }

    const cards = figures.map(makeCard);
    gallery.append(...cards);
    const counts = figures.reduce((result, figure) => ({ ...result, [figure.kind]: (result[figure.kind] || 0) + 1 }), {});
    const summary = document.getElementById("summary");
    [["mirror", "симметрия"], ["repeat", "повтори"], ["dictation", "диктант"]].forEach(([kind, label]) => {
      const item = document.createElement("div");
      item.className = "summary-item";
      item.innerHTML = "<span class='summary-value'>" + (counts[kind] || 0) + "</span><span class='summary-label'>" + label + "</span>";
      summary.append(item);
    });

    function applyFilter() {
      const query = search.value.trim().toLocaleLowerCase("ru");
      let visible = 0;
      cards.forEach((card) => {
        const matchesKind = filter === "all" || card.dataset.kind === filter;
        const matchesSearch = !query || card.dataset.search.includes(query);
        card.hidden = !(matchesKind && matchesSearch);
        if (!card.hidden) visible += 1;
      });
      document.getElementById("galleryCount").textContent = "Показано: " + visible + " из " + figures.length + " фигур.";
      document.getElementById("empty")?.remove();
      if (!visible) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.id = "empty";
        empty.textContent = "Ничего не найдено.";
        gallery.append(empty);
      }
    }
    document.querySelectorAll("[data-filter]").forEach((button) => button.addEventListener("click", () => {
      filter = button.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach((other) => other.setAttribute("aria-pressed", String(other === button)));
      applyFilter();
    }));
    search.addEventListener("input", applyFilter);
    applyFilter();
  </script>
</body>
</html>
